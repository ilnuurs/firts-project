{% extends 'base.html' %}
{% load static %}


{% block content%}
<link rel="stylesheet" href="{% static 'css/product_form.css' %}">
<div class="container">
    <h2>add product</h2>

    <div class="product_form">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token%}

            <p>
                <label>name</label>
                <input type="text" name="name" value="" required>
            </p>


            <p>
                <label>color</label>
                <input type="text" name="color" value="" required>
            </p>


            <p>
                <label>price</label>
                <input type="text" name="price" value="" required>
            </p>


            <p>
                <label>info</label>
                <textarea name="info"></textarea>
            </p>


            <p>
                <label>Category</label>
                <select name="category" required>
                    {% for cat in categories%}
                    <option value="{{cat.pk}}">
                        {{ cat.name }}
                    </option>
                    {%endfor%}
                </select>
            </p>

            <p>
                <label>img</label>
                <input type="file" name="image">
                {% if product.image %}
            <p> Текущее: <img src="{{ product.image.url }}" width="80"></p>
            {% endif %}
            </p>

            <p>
                <button type="submit">save</button>
            </p>

           

        </form>
    </div>

</div>
{% endblock content%}
